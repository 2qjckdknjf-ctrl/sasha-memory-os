# Local Supabase config for Sasha Memory OS.
# Dedicated project only — never share with AISTROYKA / HiAir (ADR-005).

project_id = "sasha-memory-os"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
site_url = "https://2qjckdknjf-ctrl.github.io"
additional_redirect_urls = [
  "https://2qjckdknjf-ctrl.github.io/sasha-memory-os/**",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.oauth_server]
enabled = true
authorization_url_path = "/sasha-memory-os/"
allow_dynamic_registration = true

# ChatGPT authenticates through Supabase OAuth 2.1. Legacy Memory OS API-secret
# clients remain supported. JWT verification stays disabled here because the
# function implements MCP resource discovery and validates OAuth/API credentials.
[functions.memory-mcp]
verify_jwt = false
