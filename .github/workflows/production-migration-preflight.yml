name: Production migration preflight (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/production-migration-preflight-run.txt

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify migration baseline checksums
        run: |
          M15=$(sha256sum supabase/migrations/20260821100000_m15_slice_01_source_event_contract.sql | awk '{print $1}')
          P0=$(sha256sum supabase/migrations/20260824100000_p0_project_identity_scope.sql | awk '{print $1}')
          test "$M15" = "aa7ac5d042e132caa6bb551b32eb145c7247b237010351a98ae544684ae9dc65"
          test "$P0" = "05e9c6d5cd5115acc829b66830024afbec40d9e0e469cc3f67a730855c996935"
          echo "migration_checksums=ok head=$(git rev-parse HEAD)"

      - name: Install Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz \
            "https://github.com/supabase/cli/releases/download/v2.115.0/supabase_linux_amd64.tar.gz"
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Credential gate
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -n "$TOKEN" ]]; then
            echo "supabase_token=present" >> "$GITHUB_OUTPUT"
          else
            echo "supabase_token=missing" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_CREDENTIALS — add SUPABASE_ACCESS_TOKEN repo secret"
          fi
          if [[ -n "$DB_PASSWORD" ]]; then echo "db_password=present" >> "$GITHUB_OUTPUT"; else echo "db_password=missing" >> "$GITHUB_OUTPUT"; fi

      - name: Link project
        if: steps.creds.outputs.supabase_token == 'present'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +x
          export SUPABASE_ACCESS_TOKEN
          supabase link --project-ref vpxblcxsvlylqyldiuwr \
            ${SUPABASE_DB_PASSWORD:+-p "$SUPABASE_DB_PASSWORD"} --yes

      - name: Migration list (read-only)
        if: steps.creds.outputs.supabase_token == 'present'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          export SUPABASE_ACCESS_TOKEN
          supabase migration list --linked --project-ref vpxblcxsvlylqyldiuwr

      - name: Backups list (read-only)
        if: steps.creds.outputs.supabase_token == 'present'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          export SUPABASE_ACCESS_TOKEN
          supabase backups list --project-ref vpxblcxsvlylqyldiuwr

      - name: db push dry-run (may fail on history drift)
        if: steps.creds.outputs.supabase_token == 'present'
        continue-on-error: true
        id: dryrun
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          export SUPABASE_ACCESS_TOKEN
          supabase db push --dry-run --linked --project-ref vpxblcxsvlylqyldiuwr
          echo "dry_run=ok" >> "$GITHUB_OUTPUT"

      - name: Pre-apply inventory SQL (read-only)
        if: steps.creds.outputs.supabase_token == 'present'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          export SUPABASE_ACCESS_TOKEN
          supabase db query --linked -f scripts/production-migration-pre-apply-inventory.sql

      - name: Dry-run status
        if: steps.creds.outputs.supabase_token == 'present'
        run: |
          if [[ "${{ steps.dryrun.outputs.dry_run }}" != "ok" ]]; then
            echo "dry_run=BLOCKED_MIGRATION_HISTORY_DRIFT"
            echo "Use scripts/apply-remote-migration.sh for M15+P0 (Management API), not db push"
          fi

      - name: Live API preflight (sanitized)
        env:
          LIVE_SECRET: ${{ secrets.MEMORY_OS_API_SECRET }}
          LIVE_SUPABASE_URL: ${{ secrets.MEMORY_OS_SUPABASE_URL }}
        run: |
          if [[ -z "$LIVE_SUPABASE_URL" || -z "$LIVE_SECRET" ]]; then
            echo "live_preflight=skipped_missing_api_secrets"
            exit 0
          fi
          export MEMORY_OS_API_BASE_URL="${LIVE_SUPABASE_URL%/}/functions/v1/memory-mcp"
          export MEMORY_OS_API_SECRET="$LIVE_SECRET"
          chmod +x scripts/ci-live-migration-preflight.sh
          ./scripts/ci-live-migration-preflight.sh
