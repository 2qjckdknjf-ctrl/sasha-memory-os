name: Worker node ticks

# Full Node consolidation + connector-sync (vault pulls) when Edge enqueue is not enough.
# Enable with repo variable MEMORY_OS_ENABLE_NODE_WORKERS=1
on:
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *'

jobs:
  consolidate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check enable flag
        id: gate
        env:
          ENABLE: ${{ vars.MEMORY_OS_ENABLE_NODE_WORKERS }}
        run: |
          if [ "$ENABLE" = "1" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Set repo variable MEMORY_OS_ENABLE_NODE_WORKERS=1 to run workers."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Consolidation once
        if: steps.gate.outputs.enabled == 'true'
        env:
          MEMORY_OS_SUPABASE_URL: ${{ secrets.MEMORY_OS_SUPABASE_URL }}
          MEMORY_OS_SUPABASE_ANON_KEY: ${{ secrets.MEMORY_OS_SUPABASE_ANON_KEY }}
          MEMORY_OS_API_SECRET: ${{ secrets.MEMORY_OS_API_SECRET }}
          MEMORY_OS_VAULT_BACKEND: ${{ secrets.MEMORY_OS_VAULT_BACKEND }}
          MEMORY_OS_VAULT_KEY: ${{ secrets.MEMORY_OS_VAULT_KEY }}
          MEMORY_OS_EMBED_ENGINE: ${{ secrets.MEMORY_OS_EMBED_ENGINE }}
          MEMORY_OS_OPENAI_API_KEY: ${{ secrets.MEMORY_OS_OPENAI_API_KEY }}
          MEMORY_OS_OPENAI_EMBED_DIMS: ${{ secrets.MEMORY_OS_OPENAI_EMBED_DIMS }}
          MEMORY_OS_CONNECTOR_PULL_MODE: ${{ secrets.MEMORY_OS_CONNECTOR_PULL_MODE }}
          MEMORY_OS_WORKSPACE_ID: ${{ secrets.MEMORY_OS_WORKSPACE_ID }}
          MEMORY_OS_OWNER_SUBJECT_ID: ${{ secrets.MEMORY_OS_OWNER_SUBJECT_ID }}
        run: pnpm --filter @memory-os/worker-consolidation consolidate:once

      - name: Connector sync once
        if: steps.gate.outputs.enabled == 'true'
        env:
          MEMORY_OS_SUPABASE_URL: ${{ secrets.MEMORY_OS_SUPABASE_URL }}
          MEMORY_OS_SUPABASE_ANON_KEY: ${{ secrets.MEMORY_OS_SUPABASE_ANON_KEY }}
          MEMORY_OS_API_SECRET: ${{ secrets.MEMORY_OS_API_SECRET }}
          MEMORY_OS_VAULT_BACKEND: ${{ secrets.MEMORY_OS_VAULT_BACKEND }}
          MEMORY_OS_VAULT_KEY: ${{ secrets.MEMORY_OS_VAULT_KEY }}
          MEMORY_OS_EMBED_ENGINE: ${{ secrets.MEMORY_OS_EMBED_ENGINE }}
          MEMORY_OS_OPENAI_API_KEY: ${{ secrets.MEMORY_OS_OPENAI_API_KEY }}
          MEMORY_OS_OPENAI_EMBED_DIMS: ${{ secrets.MEMORY_OS_OPENAI_EMBED_DIMS }}
          MEMORY_OS_CONNECTOR_PULL_MODE: ${{ secrets.MEMORY_OS_CONNECTOR_PULL_MODE }}
          MEMORY_OS_WORKSPACE_ID: ${{ secrets.MEMORY_OS_WORKSPACE_ID }}
          MEMORY_OS_OWNER_SUBJECT_ID: ${{ secrets.MEMORY_OS_OWNER_SUBJECT_ID }}
        run: pnpm --filter @memory-os/worker-connector-sync sync:once
