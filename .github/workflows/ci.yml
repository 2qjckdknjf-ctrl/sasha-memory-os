name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Dependency audit (critical)
        run: pnpm audit --audit-level=critical

      - name: Build hosted API image
        run: docker build -f apps/api/Dockerfile -t memory-os-api:ci .

      - name: Start production-like ChatGPT MCP container
        run: |
          docker run -d --name memory-os-m6 \
            -e MEMORY_OS_ENV=staging \
            -e MEMORY_OS_MCP_PROFILE=chatgpt \
            -e MEMORY_OS_REQUIRE_API_AUTH=1 \
            -e MEMORY_OS_API_SECRET=ci-m6-test-secret \
            -p 8787:8787 \
            memory-os-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/memory-os-health.json; then
              cat /tmp/memory-os-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs memory-os-m6
          exit 1

      - name: Verify MCP POST rejects unauthenticated requests
        run: |
          code=$(curl -sS -o /tmp/memory-os-mcp-unauth.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data-binary '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26"}}' \
            http://127.0.0.1:8787/mcp || true)
          echo "status=$code"
          cat /tmp/memory-os-mcp-unauth.json || true
          test "$code" = "401"

      - name: Smoke ChatGPT MCP runtime
        env:
          MEMORY_OS_API_BASE_URL: http://127.0.0.1:8787
          MEMORY_OS_API_SECRET: ci-m6-test-secret
        run: ./scripts/smoke-mcp-chatgpt.sh

      - name: Discover existing live M6 route
        continue-on-error: true
        env:
          LIVE_API: ${{ secrets.MEMORY_OS_API_BASE_URL }}
          LIVE_SECRET: ${{ secrets.MEMORY_OS_API_SECRET }}
          LIVE_SUPABASE_URL: ${{ secrets.MEMORY_OS_SUPABASE_URL }}
          LIVE_SUPABASE_SERVICE_ROLE: ${{ secrets.MEMORY_OS_SUPABASE_SERVICE_ROLE_KEY }}
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          bool() { if [[ -n "$1" ]]; then printf 'true'; else printf 'false'; fi; }
          echo "m6_live_api_configured=$(bool "$LIVE_API")"
          echo "m6_live_api_secret_configured=$(bool "$LIVE_SECRET")"
          echo "m6_supabase_url_secret_configured=$(bool "$LIVE_SUPABASE_URL")"
          echo "m6_supabase_service_role_configured=$(bool "$LIVE_SUPABASE_SERVICE_ROLE")"
          echo "m6_fly_token_configured=$(bool "$FLY_TOKEN")"

          if [[ -z "$LIVE_API" ]]; then
            echo "m6_live_probe=skipped_no_api_base"
            exit 0
          fi

          header=()
          if [[ -n "$LIVE_SECRET" ]]; then
            header=(-H "x-memory-os-api-secret: $LIVE_SECRET")
          fi
          base="${LIVE_API%/}"
          code=$(curl -sS --connect-timeout 5 --max-time 15 \
            -o /tmp/m6-live-health.json -w '%{http_code}' \
            "${header[@]}" "$base/mcp/health" || true)
          echo "m6_live_mcp_health_http=$code"

          if [[ "$code" != "200" ]]; then
            echo "m6_live_mcp_route=not_ready"
            exit 0
          fi

          node - <<'NODE'
          const fs = require('fs');
          try {
            const h = JSON.parse(fs.readFileSync('/tmp/m6-live-health.json', 'utf8'));
            console.log(`m6_live_service=${h.service ?? 'unknown'}`);
            console.log(`m6_live_backend=${h.backend ?? 'unknown'}`);
            console.log(`m6_live_profile=${h.profile ?? 'unknown'}`);
            console.log(`m6_live_transport=${h.transport ?? 'unknown'}`);
            const ready = h.ok === true && h.service === 'memory-os-mcp' && h.backend === 'supabase' && h.profile === 'chatgpt';
            console.log(`m6_live_readiness=${ready ? 'candidate_ready' : 'wrong_runtime'}`);
          } catch (err) {
            console.log('m6_live_readiness=invalid_health_payload');
            process.exitCode = 0;
          }
          NODE

      - name: Container logs
        if: always()
        run: docker logs memory-os-m6 || true

      - name: Stop ChatGPT-profile API container
        if: always()
        run: docker rm -f memory-os-m6 || true
