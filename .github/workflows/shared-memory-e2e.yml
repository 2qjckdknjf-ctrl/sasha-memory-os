name: Shared Memory E2E

on:
  workflow_dispatch:
    inputs:
      chatgpt_memory_id:
        description: Memory ID written by the real ChatGPT MCP session
        required: true
        type: string
      chatgpt_marker:
        description: Unique marker contained in the ChatGPT receipt
        required: true
        type: string
      cursor_memory_id:
        description: Memory ID written by the real Cursor MCP session
        required: true
        type: string
      cursor_marker:
        description: Unique marker contained in the Cursor receipt
        required: true
        type: string
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  fixture-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: P0 project identity pack
        run: pnpm exec vitest run tests/security/p0_project_identity_pack.test.ts

      - name: Project identity schema tests
        run: pnpm --filter @memory-os/schemas test -- projectIdentity

  live-e2e:
    runs-on: ubuntu-latest
    needs: fixture-gate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Verify live ChatGPT and Cursor session receipts
        env:
          LIVE_SECRET: ${{ secrets.MEMORY_OS_API_SECRET }}
          LIVE_SUPABASE_URL: ${{ secrets.MEMORY_OS_SUPABASE_URL }}
          MEMORY_OS_PROJECT_ID: ${{ secrets.MEMORY_OS_PROJECT_ID }}
          SHARED_MEMORY_CHATGPT_MEMORY_ID: ${{ inputs.chatgpt_memory_id }}
          SHARED_MEMORY_CHATGPT_MARKER: ${{ inputs.chatgpt_marker }}
          SHARED_MEMORY_CURSOR_MEMORY_ID: ${{ inputs.cursor_memory_id }}
          SHARED_MEMORY_CURSOR_MARKER: ${{ inputs.cursor_marker }}
        run: |
          if [[ -z "$LIVE_SECRET" || -z "$LIVE_SUPABASE_URL" ]]; then
            echo "shared_memory_e2e=BLOCKED_missing_repo_secrets" >&2
            exit 2
          fi
          export MEMORY_OS_API_SECRET="$LIVE_SECRET"
          export MEMORY_OS_API_BASE_URL="${LIVE_SUPABASE_URL%/}/functions/v1/memory-mcp"
          export SHARED_MEMORY_E2E_RESULT="$RUNNER_TEMP/SHARED_MEMORY_E2E_RESULT.json"
          ./scripts/acceptance-shared-memory-e2e.sh
          node -e '
            const result = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (result.overallStatus !== "PASS" || result.claimPassFromMocks !== false) process.exit(1);
          ' "$SHARED_MEMORY_E2E_RESULT"

      - name: Upload acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: shared-memory-e2e-result
          path: ${{ runner.temp }}/SHARED_MEMORY_E2E_RESULT.json
          if-no-files-found: error
