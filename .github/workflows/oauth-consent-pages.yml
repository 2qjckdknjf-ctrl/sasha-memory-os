name: Deploy OAuth consent page

on:
  push:
    branches:
      - main
      - feature/m6-chatgpt-production-mcp
    paths:
      - supabase/oauth-consent/**
      - .github/workflows/oauth-consent-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload consent page
        uses: actions/upload-pages-artifact@v3
        with:
          path: supabase/oauth-consent
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
